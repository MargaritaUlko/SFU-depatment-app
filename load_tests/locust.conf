# Locust конфиг для headless-запуска
# Применяется автоматически при --config load_tests/locust.conf
#
# Бизнес-требования: кафедра 100 студентов + 25 преподов = 125 человек сейчас.
# Пик онлайн: ~100 (80% от 125).
# При реалистичном wait_time 8-25s суммарный RPS ~8-15.

host = http://localhost:8000

users = 100
spawn-rate = 10
run-time = 5m

# Отчёт
html = load_tests/report.html
csv = load_tests/results

# Не останавливаться при первых ошибках
exit-code-on-error = 1
