# Locust конфиг для headless-запуска
# Применяется автоматически при --config load_tests/locust.conf
#
# Бизнес-требования: кафедра 100 студентов + 25 преподов сейчас,
# рост до 300 пользователей за 5 лет.
# Пик онлайн: ~240 (80% от 300). Стресс-тест = 2× пика → 500 пользователей.
# При реалистичном wait_time 8-25s суммарный RPS ~25-40.

host = http://localhost:8000

users = 500
spawn-rate = 25
run-time = 5m

# Отчёт
html = load_tests/report.html
csv = load_tests/results

# Не останавливаться при первых ошибках
exit-code-on-error = 1
